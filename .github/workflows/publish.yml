name: Publish to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*"

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Run CLI smoke checks
        run: |
          uv run rsplot --version
          uv run rsplot --help >/dev/null
          uv run python -c "from rsplot.cli import app; print(app.info.name)"

      - name: Build distributions
        run: uv build --no-sources

      - name: Check distribution metadata
        run: uvx --from twine==7.0.0 twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-development:
    name: Publish development release
    if: >-
      github.repository == 'yaoyhu/rsplot' &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-dev
      url: https://pypi.org/p/rsplot
    permissions:
      id-token: write # Required for PyPI's short-lived OIDC credential.
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Publish with PyPI Trusted Publishing
        run: uv publish --trusted-publishing always

  publish-stable:
    name: Publish stable release
    if: >-
      github.repository == 'yaoyhu/rsplot' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rsplot
    permissions:
      id-token: write # Required for PyPI's short-lived OIDC credential.
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Publish with PyPI Trusted Publishing
        run: uv publish --trusted-publishing always
