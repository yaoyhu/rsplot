# Example rsplot configuration.
#
# Copy this file to ~/.config/rsplot/config.toml and replace the placeholder
# paths with paths available on your machine. You can also point RSPLOT_CONFIG
# at any TOML file with the same structure.

[paths]
geojson_dir = "/path/to/geojson"
font_dir = "/path/to/fonts"
# hcho_cmap_file = "/path/to/256x3_rgb_table.txt"

[paths.data_dirs]
no2 = "/path/to/NO2"
o3 = "/path/to/O3"
o3pr = "/path/to/O3PR"
hcho = "/path/to/HCHO"
# GEMS roots contain YYYYMM/DD/*.nc. Both o3 and o3pr use gems_o3.
gems_no2 = "/path/to/GEMS/NO2"
gems_hcho = "/path/to/GEMS/HCHO"
gems_o3 = "/path/to/GEMS/O3"
guokong = "/path/to/guokong_combine"
era5 = "/path/to/era5"
forecast = "/path/to/forecast"
reconstruct = "/path/to/reconstruct"

# Optional city-specific lower-level boundaries. This is useful for direct-
# administered cities whose towns/streets are absent from 中国_县.geojson.
# Shapefile and GeoJSON sources are both supported and reprojected at load time.
# [subdivision_overrides."中山市"]
# path = "/path/to/中山市镇街界线.shp"
# name_field = "镇街名称"
# level = "township"

# Optional satellite basemap key. Leave commented unless you have a real key.
# [tianditu]
# api_key = "your-real-key"

[defaults]
dpi = 300
qa_threshold = 0.5

# Optional key-region overrides or additions.
#
# [key_regions]
# MY_REGION = ["Province A", "Province B"]
