[project]
name = "rsplot"
dynamic = ["version"]
description = "CLI tool for plotting Remote Sensing data, designed for Agent."
authors = [
    { name = "Yaoyao Hu", email = "yaoyhu@mail.ustc.edu.cn" },
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "numpy>=1.24",
    "xarray>=2023.0",
    "scipy>=1.10",
    "astropy>=5.3",
    "matplotlib>=3.7",
    "cartopy>=0.21",
    "geopandas>=0.13",
    "shapely>=2.0",
    "tomli>=2.0; python_version < '3.11'",
    "netcdf4>=1.7.3",
]

[project.urls]
Repository = "https://git.lug.ustc.edu.cn/yaoyhu/rsplot"
GitHub = "https://github.com/yaoyhu/rsplot"

[project.scripts]
rsplot = "rsplot.__main__:app"

[build-system]
requires = ["hatchling", "hatch-vcs>=0.5,<0.6"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.hatch.build.targets.sdist]
only-include = ["src/rsplot"]

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/rsplot"]

[tool.ruff]
target-version = "py310"
line-length = 79
fix = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
